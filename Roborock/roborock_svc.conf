# Настройки roborock_svc (v1.2+). Файл читается при каждом запуске службы.
# Переменные окружения RR_* в systemd-юните имеют приоритет над этим файлом.
# Необязательные параметры можно не указывать — подставятся значения ниже.

[roborock]
# ID пылесоса в аккаунте Roborock
duid = ВАШ_DUID
# Порт HTTP API (3D-дашборд, панель HomeBridge)
http_port = 8590

[mqtt]
# Брокер Sprut.hub
host = 192.168.1.10
port = 1883
# Корень топиков: roborock/saros10r/...
topic = roborock/saros10r

[poll]
# Периодичность чтения статуса с робота, сек (пока робот двигается)
status_moving_s = 5
# Периодичность чтения карты, сек: пока двигается / на базе
map_moving_s = 1
map_idle_s = 600

[start]
# Окно сборки параметров перед стартом уборки из Sprut.hub, сек (атомарность)
settle_s = 0.5
# Выбор комнат живёт столько секунд; старше — считается «залипшим» и игнорируется
select_ttl_s = 120

[log]
# Каталог для roborock_svc.log и events.log (нужен доступ на запись у пользователя roborock)
dir = /opt/roborock
# Ротация: максимум МБ на файл и число старых копий
max_mb = 2
backups = 3
# Сколько последних событий держать в памяти (HTTP GET /events)
events_max = 200
